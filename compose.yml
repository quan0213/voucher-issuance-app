services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: vouchers
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD before using Docker Compose}
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - voucher-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vouchers"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  voucher-postgres:
